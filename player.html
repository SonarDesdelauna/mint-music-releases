<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mint Music player</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#p{width:100vw;height:100vh}</style>
</head>
<body>
<!-- Player ufficiale YouTube IFrame per l'app iOS di Mint Music, comandato dall'app con postMessage. -->
<div id="p"></div>
<script>
(function () {
  var player = null, parentOrigin = '*';
  var send = function (data) { data.source = 'mint-yt'; window.parent.postMessage(data, parentOrigin); };
  var snapshot = function (type) {
    if (!player || !player.getCurrentTime) return;
    var video = player.getVideoData ? player.getVideoData() : {};
    send({ type: type, time: player.getCurrentTime() || 0, duration: player.getDuration() || 0, state: player.getPlayerState(),
      video: { video_id: video.video_id, title: video.title, author: video.author } });
  };
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 1, playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: function () { send({ type: 'ready' }); setInterval(function () { snapshot('progress'); }, 500); },
        onStateChange: function () { snapshot('state'); },
        onError: function (event) { send({ type: 'error', code: event.data }); }
      }
    });
  };
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var data = event.data || {};
    if (data.source !== 'mint-app' || !player) return;
    var args = data.args || [];
    switch (data.cmd) {
      case 'load': player.loadVideoById(String(args[0] || '')); break;
      case 'cue': player.cueVideoById(String(args[0] || '')); break;
      case 'play': player.playVideo(); break;
      case 'pause': player.pauseVideo(); break;
      case 'seek': player.seekTo(Number(args[0]) || 0, true); break;
      case 'meta':
        var m = args[0] || {};
        if (navigator.mediaSession && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: m.title || '', artist: m.artist || '', album: m.album || '', artwork: m.artwork ? [{ src: m.artwork, sizes: '600x600' }] : [] });
        break;
      case 'volume': player.setVolume(Math.max(0, Math.min(100, Number(args[0]) || 0))); break;
    }
    snapshot('state');
  });
  var script = document.createElement('script');
  script.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(script);
})();
</script>
</body>
</html>
